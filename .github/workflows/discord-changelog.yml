name: Post changelog to Discord

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md

permissions:
  contents: read

jobs:
  post-changelog:
    if: github.repository == 'zeousky/owaua'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Post the newest changelog entry
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          webhook = os.environ.get("DISCORD_WEBHOOK", "")
          if not webhook:
              print("DISCORD_CHANGELOG_WEBHOOK is not configured; skipping.")
              raise SystemExit(0)

          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          sections = re.split(r"(?m)^##\s+", text)
          entry = next((part.strip() for part in sections[1:] if part.strip()), "")
          if not entry or entry == "YYYY-MM-DD":
              print("No dated changelog entry to post; skipping.")
              raise SystemExit(0)

          lines = entry.splitlines()
          title = lines[0].strip()
          description = "\n".join(lines[1:]).strip()
          if not description:
              description = "A new Owaua changelog entry is available."
          if len(description) > 4000:
              description = description[:3997] + "..."

          if len(title) > 256:
              title = title[:253] + "..."
          embed = {
              "title": f"Owaua changelog — {title}",
              "description": description,
              "color": 0x8B5CF6,
              "footer": {"text": "Owaua changelog"},
          }

          payload = json.dumps({
              "embeds": [embed],
              "allowed_mentions": {"parse": []},
          }).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com/zeousky/owaua, 1.0)",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if not 200 <= response.status < 300:
                      raise SystemExit(f"Discord returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", errors="replace")[:500]
              raise SystemExit(f"Discord returned HTTP {error.code}: {detail}") from None
          print("Posted the newest changelog entry to Discord.")
          PY
