name: Post changelog to Discord

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md

permissions:
  contents: read

jobs:
  post-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Post the newest changelog entry
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          webhook = os.environ.get("DISCORD_WEBHOOK", "")
          if not webhook:
              raise SystemExit("DISCORD_CHANGELOG_WEBHOOK is not configured")

          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          sections = re.split(r"(?m)^##\s+", text)
          entry = next((part.strip() for part in sections[1:] if part.strip()), "")
          if not entry or entry == "YYYY-MM-DD":
              print("No dated changelog entry to post; skipping.")
              raise SystemExit(0)

          lines = entry.splitlines()
          title = lines[0].strip()
          description = "\n".join(lines[1:]).strip()
          if not description:
              description = "A new Kirmy changelog entry is available."
          if len(description) > 4000:
              description = description[:3997] + "..."

          if len(title) > 256:
              title = title[:253] + "..."
          embed = {
              "title": f"Kirmy changelog — {title}",
              "description": description,
              "color": 0x8B5CF6,
              "footer": {"text": "Kirmy changelog"},
          }

          payload = json.dumps({
              "embeds": [embed],
              "allowed_mentions": {"parse": []},
          }).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com/zeousky/kirmy-bot, 1.0)",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if not 200 <= response.status < 300:
                      raise SystemExit(f"Discord returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", errors="replace")[:500]
              raise SystemExit(f"Discord returned HTTP {error.code}: {detail}") from None
          print("Posted the newest changelog entry to Discord.")
          PY
