name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up cloud development environment
        run: bash scripts/setup-codex.sh
      - name: Run unit tests
        run: bash scripts/test.sh
      - name: Audit runtime dependencies
        run: .venv/bin/python -m pip install pip-audit && .venv/bin/python -m pip_audit -r requirements.txt
